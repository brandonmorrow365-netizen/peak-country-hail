name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm exec wrangler d1 migrations apply peak-country-hail-db --local --config wrangler.local.jsonc
      - name: Smoke test preview
        run: |
          pnpm exec astro preview --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ > /dev/null && break
            sleep 1
          done
          pnpm run test:site
